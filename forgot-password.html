
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Request a Corridor Funding password reset.">
  <title>Forgot Password | Corridor Funding</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="auth.css">
  <script type="module" src="auth.js"></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="index.html" aria-label="Corridor Funding home">
      <img src="logo.svg" alt="Corridor Funding">
    </a>
    <a href="login.html">Sign in</a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1>Reset your password</h1>
      <p class="auth-intro">Enter your email address to request a password-reset email.</p>

      <div id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></div>

      <form id="forgotPasswordForm" class="auth-form">
        <div class="auth-field">
          <label for="forgotEmail">Email address</label>
          <input id="forgotEmail" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>

        <button class="auth-submit" type="submit">Send reset email</button>
      </form>

      <p class="auth-note">For account security, the confirmation message does not reveal whether an email address has an account.</p>

      <nav class="auth-links" aria-label="Account links">
        <a href="login.html">Back to sign in</a>
        <a href="register.html">Create account</a>
      </nav>
    </section>
  </main>

  <footer class="auth-footer">
    <a href="privacy.html">Privacy</a> ·
    <a href="contact.html">Contact</a>
  </footer>
</body>
</html>
