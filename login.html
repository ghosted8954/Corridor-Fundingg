
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sign in securely to your Corridor Funding account.">
  <title>Sign In | Corridor Funding</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="auth.css">
  <script type="module" src="auth.js"></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="index.html" aria-label="Corridor Funding home">
      <img src="logo.svg" alt="Corridor Funding">
    </a>
    <a href="register.html">Create account</a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1>Welcome back</h1>
      <p class="auth-intro">Sign in to access your account and application information.</p>

      <div id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></div>

      <form id="loginForm" class="auth-form">
        <div class="auth-field">
          <label for="loginEmail">Email address</label>
          <input id="loginEmail" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>

        <div class="auth-field">
          <label for="loginPassword">Password</label>
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </div>

        <button class="auth-submit" type="submit">Sign in</button>
      </form>

      <nav class="auth-links" aria-label="Account links">
        <a href="forgot-password.html">Forgot password?</a>
        <a href="register.html">Create an account</a>
      </nav>

      <p class="auth-note">Protect your password. Corridor Funding will never ask you to send it by email or chat.</p>
    </section>
  </main>

  <footer class="auth-footer">
    <a href="privacy.html">Privacy</a> ·
    <a href="terms.html">Terms</a> ·
    <a href="contact.html">Contact</a>
  </footer>
</body>
</html>
