
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Choose a new Corridor Funding account password.">
  <title>Choose New Password | Corridor Funding</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="responsive.css">
  <link rel="stylesheet" href="auth.css">
  <script type="module" src="auth.js"></script>
</head>
<body class="auth-page">
  <header class="auth-header">
    <a href="index.html" aria-label="Corridor Funding home">
      <img src="logo.svg" alt="Corridor Funding">
    </a>
    <a href="login.html">Sign in</a>
  </header>

  <main class="auth-main">
    <section class="auth-card">
      <h1>Choose a new password</h1>
      <p class="auth-intro">Create a new password for your account.</p>

      <div id="authMessage" class="auth-message" role="status" aria-live="polite" hidden></div>

      <form id="resetPasswordForm" class="auth-form" hidden>
        <div class="auth-field">
          <label for="newPassword">New password</label>
          <input id="newPassword" name="newPassword" type="password" autocomplete="new-password" required minlength="8">
        </div>

        <div class="auth-field">
          <label for="confirmNewPassword">Confirm new password</label>
          <input id="confirmNewPassword" name="confirmNewPassword" type="password" autocomplete="new-password" required minlength="8">
        </div>

        <button class="auth-submit" type="submit">Update password</button>
      </form>

      <nav class="auth-links" aria-label="Account links">
        <a id="resetLoginLink" href="login.html" hidden>Go to sign in</a>
        <a href="forgot-password.html">Request another reset link</a>
      </nav>
    </section>
  </main>

  <footer class="auth-footer">
    <a href="privacy.html">Privacy</a> ·
    <a href="contact.html">Contact</a>
  </footer>
</body>
</html>
